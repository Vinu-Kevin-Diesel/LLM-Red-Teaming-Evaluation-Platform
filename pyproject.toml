[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-forge"
version = "0.1.0"
description = "Modular LLM evaluation and red-teaming framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.39",
    "huggingface-hub>=0.25",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
]

[project.scripts]
llm-eval-forge = "llm_eval_forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
