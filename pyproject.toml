[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-forge"
version = "0.1.0"
description = "Modular LLM evaluation and red-teaming framework"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.94",
    "pydantic>=2.0",
    "huggingface-hub>=0.25",
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
]

[project.scripts]
llm-eval-forge = "llm_eval_forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "fastapi>=0.110"]
# Serving the exported judge on CPU (ONNX Runtime; no torch needed)
serve = ["fastapi>=0.110", "uvicorn>=0.30", "onnxruntime>=1.19", "tokenizers>=0.21", "numpy>=1.26"]
# Distillation, training and serving of the small judge (install torch from the CUDA index first)
ml = [
    "datasets>=3.0",
    "torch>=2.7",
    "transformers>=4.51,<5",
    "tokenizers>=0.21",
    "peft>=0.13",
    "scikit-learn>=1.5",
    "onnx>=1.16",
    "onnx-ir>=0.1",
    "onnxruntime>=1.19",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
